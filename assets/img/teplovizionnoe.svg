<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e3c"/>
      <stop offset="1" stop-color="#072758"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4bb0f"/>
      <stop offset="0.5" stop-color="#f07f13"/>
      <stop offset="1" stop-color="#e31e24"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33475e"/>
      <stop offset="1" stop-color="#16263a"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#bg2)"/>
  <!-- thermal camera body -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="250" height="180" rx="18" fill="url(#cam)"/>
    <rect x="20" y="22" width="210" height="136" rx="8" fill="#04101f"/>
    <!-- thermal image on screen -->
    <rect x="28" y="30" width="194" height="120" rx="4" fill="#12355e"/>
    <rect x="60" y="44" width="26" height="106" fill="#1d5c9e"/>
    <rect x="106" y="44" width="26" height="106" fill="#2b79c7"/>
    <rect x="152" y="44" width="26" height="106" fill="#1d5c9e"/>
    <ellipse cx="119" cy="86" rx="34" ry="26" fill="url(#heat)"/>
    <ellipse cx="119" cy="86" rx="16" ry="12" fill="#fff3c4"/>
    <circle cx="119" cy="86" r="44" fill="none" stroke="#f4bb0f" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
  <!-- handle -->
  <rect x="150" y="270" width="60" height="80" rx="14" fill="url(#cam)"/>
  <rect x="163" y="282" width="34" height="16" rx="8" fill="#e31e24"/>
  <!-- lens rays toward cabinet -->
  <g stroke="#f4bb0f" stroke-width="3" opacity="0.85">
    <line x1="345" y1="150" x2="470" y2="120"/>
    <line x1="345" y1="185" x2="470" y2="185"/>
    <line x1="345" y1="220" x2="470" y2="250"/>
  </g>
  <!-- electrical cabinet -->
  <g transform="translate(470,80)">
    <rect x="0" y="0" width="160" height="240" rx="10" fill="#8ea3b8"/>
    <rect x="14" y="14" width="132" height="212" rx="6" fill="#c9d6e4"/>
    <rect x="28" y="30" width="46" height="60" rx="4" fill="#55677c"/>
    <rect x="86" y="30" width="46" height="60" rx="4" fill="#55677c"/>
    <ellipse cx="80" cy="150" rx="38" ry="30" fill="url(#heat)" opacity="0.9"/>
    <ellipse cx="80" cy="150" rx="16" ry="13" fill="#fff3c4"/>
    <rect x="28" y="196" width="104" height="14" rx="4" fill="#55677c"/>
  </g>
  <text x="350" y="368" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">Тепловизионный контроль электрооборудования</text>
</svg>
